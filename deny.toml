# cargo-deny configuration.
#
# Two things matter here: we must not ship a security advisory, and every dependency licence must
# permit commercial use. The second is easy to get wrong late — a copyleft transitive dependency
# discovered before launch is a nuisance; discovered after is a problem.

[advisories]
yanked = "deny"
ignore = []

[licenses]
# Permissive licences only. Anything else needs a deliberate exception with a reason.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
