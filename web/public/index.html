<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="description" content="محرك البحث الجزائري">
<title>Xustive — محرك البحث الجزائري</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<a class="skip-link" href="#search-input">تخطي إلى البحث</a>

<main class="home">
  <div>
    <a class="wordmark" href="/">XUSTIVE</a>
    <p class="tagline">محرك البحث الجزائري</p>
  </div>

  <!--
    The form targets the server-rendered /search route, so search works with JavaScript
    disabled. app.js upgrades it to a client-side fetch when JS is available.
  -->
  <form class="search-box" role="search" action="/search" method="get">
    <input id="search-input"
           type="search"
           name="q"
           dir="auto"
           autocomplete="off"
           spellcheck="false"
           enterkeyhint="search"
           maxlength="512"
           placeholder="ابحث…"
           aria-label="ابحث">
    <button type="submit" aria-label="ابحث">🔍</button>
  </form>

  <p class="privacy-line">🔒 ما نسجلوش عمليات البحث تاعك</p>
</main>

<footer class="site-footer">
  <span>Xustive · self-hosted in Algeria</span>
</footer>

<script src="/app.js" defer></script>
</body>
</html>
