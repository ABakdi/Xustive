[package]
name = "xustive-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Operator tooling: index migration, seeding, and text debugging."

[[bin]]
name = "xustive-cli"
path = "src/main.rs"

[dependencies]
xustive-core = { path = "../xustive-core" }
xustive-text = { path = "../xustive-text" }
xustive-search = { path = "../xustive-search" }
xustive-ingest = { path = "../xustive-ingest" }
url.workspace = true

clap.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
