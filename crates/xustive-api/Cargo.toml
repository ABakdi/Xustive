[package]
name = "xustive-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "HTTP surface: routing, validation, limits, error shaping, and the search handler."

[dependencies]
xustive-core = { path = "../xustive-core" }
xustive-text = { path = "../xustive-text" }
xustive-toold = { path = "../xustive-toold" }
xustive-tools = { path = "../xustive-tools" }
xustive-search = { path = "../xustive-search" }
xustive-lang = { path = "../xustive-lang" }
blake3.workspace = true
xustive-ml = { path = "../xustive-ml", default-features = false }

axum.workspace = true
tower = { workspace = true, features = ["load-shed", "limit", "util", "buffer"] }
tower-http.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
http.workspace = true

serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
ulid.workspace = true
clap.workspace = true
url.workspace = true
async-stream = "0.3.6"
futures-util = "0.3.33"
xustive-ingest = { version = "0.1.0", path = "../xustive-ingest" }
xustive-queue = { version = "0.1.0", path = "../xustive-queue" }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"

[features]
default = ["summariser"]
# Local summarisation. Compiles llama.cpp from source, which takes a few minutes the first time,
# so it can be turned off for fast iteration on the rest of the API.
summariser = ["xustive-ml/llama"]
# GPU offload for the summariser. Requires the CUDA toolkit at build time.
cuda = ["summariser", "xustive-ml/cuda"]
