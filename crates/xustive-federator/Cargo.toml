[package]
name = "xustive-federator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Federation Gateway: the one allowlisted egress hop between the serving plane and a self-hosted SearXNG."

[dependencies]
# Only the federation leaf crate — deliberately NOT xustive-ingest, whose native OCR deps
# (leptonica/tesseract) the gateway has no use for and which broke its Docker build.
xustive-federation = { path = "../xustive-federation" }
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "signal", "net"] }
clap.workspace = true
anyhow.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
