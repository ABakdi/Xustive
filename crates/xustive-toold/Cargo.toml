[package]
name = "xustive-toold"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Scheduled fetch of external tool data into a cache the serving plane reads."

[dependencies]
xustive-core = { path = "../xustive-core" }
xustive-tools = { path = "../xustive-tools" }
xustive-knowledge = { path = "../xustive-knowledge" }
# Not xustive-ingest: this process needs one signal store, and the crawl pipeline would drag in
# leptonica/tesseract, which do not build in this image and have no business in the one process
# that talks to the open internet.
xustive-signals = { path = "../xustive-signals" }
xustive-search = { path = "../xustive-search" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "signal"] }
reqwest.workspace = true
redis = { version = "0.27", default-features = false, features = ["tokio-comp"] }
clap.workspace = true
anyhow.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
