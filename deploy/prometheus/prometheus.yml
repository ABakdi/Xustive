global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: dev

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # xustive-api runs on the host during development.
  - job_name: xustive-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: meilisearch
    metrics_path: /metrics
    static_configs:
      - targets: ["meilisearch:7700"]
