# Development topology.
#
# Network segmentation is the load-bearing part: `core` is `internal: true`, so Meilisearch,
# Qdrant and Redis have no route to or from the outside world. Only `xustive-crawler` (added in
# M3) will sit on a network with egress.
#
# There is deliberately no `ports:` mapping on meilisearch/qdrant/redis in production; the dev
# overrides below expose them on localhost only so `xustive-cli` and tests can reach them.
#
# Resource limits follow [[Performance Budgets]] §7, scaled down for a development machine — the
# production figures there assume a 10M-document index and would reserve more RAM than a laptop
# has. What matters is that the limits exist at all: without them one runaway indexing job takes
# the whole machine down, and the failure looks like a hung search rather than an out-of-memory
# kill. The ratios between services are preserved.
#
# `mem_limit` and `cpus` are the Compose-v2 spellings that work without Swarm. `deploy.resources`
# is silently ignored by `docker compose up`, which is a good way to believe you have limits when
# you do not.

name: xustive

services:
  meilisearch:
    image: getmeili/meilisearch:v1.13
    container_name: xustive-meilisearch
    # Production ceiling is 32 GB / 8 vCPU. This development slice is tuned for a 12-core host that
    # also runs the release-mode crawler, index worker and API: Meili gets half the cores for a
    # bulk index and the other half stays free for the fetch/parse pipeline feeding it.
    mem_limit: 5g
    cpus: 6.0
    environment:
      MEILI_ENV: development
      # Empty by default so development needs no setup. Set MEILI_MASTER_KEY in .env to exercise
      # the scoped-key path (`xustive-cli keys`) — without a master key Meilisearch has no key
      # API at all, so search-only and index-only credentials cannot exist.
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-}
      MEILI_NO_ANALYTICS: "true"
      MEILI_MAX_INDEXING_MEMORY: 3Gb
      # Six of the host's twelve cores for indexing — three times the old cap, so a backlog drains
      # fast, while the remaining six keep the crawler and worker fetching and parsing in parallel.
      MEILI_MAX_INDEXING_THREADS: 6
      MEILI_EXPERIMENTAL_ENABLE_METRICS: "true"
    volumes:
      - meili_data:/meili_data
    networks: [core]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7700/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: xustive-qdrant
    # Unused until M2, so it gets the smallest slice that still starts.
    mem_limit: 2g
    cpus: 2.0
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [core]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: xustive-redis
    # Just above the 1 GB maxmemory above, leaving room for AOF buffers and overhead.
    mem_limit: 1500m
    cpus: 1.0
    # noeviction is not optional: under allkeys-lru Redis would silently drop queue entries
    # and frontier state, losing crawl work invisibly.
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 1gb
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    networks: [core]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Fetches weather and, later, rates into the cache the serving plane reads.
  #
  # On `ingest` *and* `core`, which looks like a hole and is not: `core` is internal, so joining
  # it grants no egress — it grants reachability to Redis. This process is the bridge across that
  # boundary and is the only thing that should be, which is why it takes no user input at all.
  # Its inputs are a schedule and a fixed list of URLs.
  toold:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.toold
    container_name: xustive-toold
    # Just above what a single pass needs; this holds no model and caches nothing large.
    mem_limit: 256m
    cpus: 0.5
    environment:
      REDIS_URL: redis://redis:6379
      RUST_LOG: info
    networks: [ingest, core]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Optional high-quality OCR: the Unlimited-OCR sidecar (a 3B GPU vision-language model). Off
  # unless the `ocr` profile is enabled, because it needs a real GPU (≥ 8 GB) that the reference
  # hardware does not have — the always-on engine is tesseract, in-process in the Rust API, and it
  # requires none of this. See [[ADR-0016 - Two OCR Engines with an Optional Unlimited-OCR Sidecar]].
  #
  # On `core` (internal, no egress): the serving plane reaches it the way it reaches Meilisearch,
  # and it must not phone home. `HF_HUB_OFFLINE=1` enforces that — the weights are provisioned into
  # the `ocr_models` volume out-of-band (a model-init step, like the summariser's), never downloaded
  # at runtime. No published port here; the dev override adds one so a host-run API can reach it.
  ocr-sidecar:
    build:
      context: ../services/ocr-sidecar
    container_name: xustive-ocr-sidecar
    profiles: ["ocr"]
    # A 3B model in bf16 plus image activations. This is the development slice; a production box
    # sizes it to the GPU. The limit exists so a wedged load cannot take the host down.
    mem_limit: 10g
    cpus: 4.0
    environment:
      OCR_MODEL: baidu/Unlimited-OCR
      HF_HOME: /models/hf
      # No runtime egress: the weights are already in the volume, and the model is never fetched.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      # Pre-provisioned weights, read-only. The service never writes here.
      - ocr_models:/models/hf:ro
    networks: [core]
    # GPU reservation. `deploy.resources.reservations.devices` is the spelling `docker compose up`
    # honours for GPUs (unlike the mem/cpu keys under it, which is why those stay as mem_limit/cpus).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8091/health || exit 1"]
      interval: 15s
      timeout: 5s
      # Loading a 3B model takes tens of seconds; do not mark it unhealthy before it has a chance.
      retries: 20
      start_period: 120s
    restart: unless-stopped

  # CLIP embed sidecar: image → 512-d vector, for image-similarity search. Behind the `vector`
  # profile (off by default). Unlike the OCR sidecar this is CPU-capable — no GPU reservation — so
  # image similarity runs on the reference hardware. On `core` (internal, no egress); weights are
  # provisioned into `clip_models` out-of-band (`HF_HUB_OFFLINE=1`). See [[Vector Index]].
  clip-embed:
    build:
      context: ../services/clip-embed
    container_name: xustive-clip-embed
    profiles: ["vector"]
    # CLIP ViT-B/32 is small; this holds the model plus a little headroom.
    mem_limit: 2g
    cpus: 2.0
    environment:
      CLIP_MODEL: openai/clip-vit-base-patch32
      HF_HOME: /models/hf
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - clip_models:/models/hf:ro
    networks: [core]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8092/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  # Speech-to-text sidecar for voice search. Behind the `voice` profile (off by default). Whisper
  # small runs CPU-only, so no GPU reservation. On `core` (internal, no egress); weights provisioned
  # into `stt_models` out-of-band (`HF_HUB_OFFLINE=1`). See services/stt-sidecar.
  stt-sidecar:
    build:
      context: ../services/stt-sidecar
    container_name: xustive-stt-sidecar
    profiles: ["voice"]
    mem_limit: 2g
    cpus: 2.0
    environment:
      STT_MODEL: small
      HF_HOME: /models/hf
      HF_HUB_OFFLINE: "1"
    volumes:
      - stt_models:/models/hf:ro
    networks: [core]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8093/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  # Self-hosted SearXNG metasearch aggregator for query-time federation (M7-T04, [[ADR-0017]]).
  # On the egress `ingest` network only — a user query reaches third-party engines through our own
  # SearXNG, never carrying a client IP or identity. The serving plane cannot reach it directly; the
  # Federation Gateway (a later increment) bridges to it. Behind the `federation` profile, so it is
  # off unless explicitly enabled, and has no published port.
  #
  # `:latest` is a deliberate exception to the pin-every-image rule: SearXNG publishes only rolling
  # date tags, and this is an off-by-default optional sidecar. JSON output is enabled via the mounted
  # settings file (the image ships it disabled).
  searxng:
    image: searxng/searxng:latest
    container_name: xustive-searxng
    profiles: ["federation"]
    mem_limit: 512m
    cpus: 1.0
    environment:
      SEARXNG_BASE_URL: http://xustive-searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-xustive-dev-searxng-secret-change-me}
    volumes:
      - ../services/searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks: [ingest]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: xustive-prometheus
    # Observability must never crowd out the thing it observes.
    mem_limit: 1g
    cpus: 1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prom_data:/prometheus
    networks: [core, obs]
    extra_hosts:
      # Lets Prometheus scrape xustive-api running on the host during development.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: xustive-grafana
    # Observability must never crowd out the thing it observes.
    mem_limit: 512m
    cpus: 0.5
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [obs]
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  meili_data:
  qdrant_data:
  redis_data:
  prom_data:
  grafana_data:
  # Pre-provisioned Unlimited-OCR weights (HuggingFace cache layout). Populated out-of-band, mounted
  # read-only into the sidecar so `core` needs no egress. Empty unless the `ocr` profile is used.
  ocr_models:
  # Pre-provisioned CLIP weights, same posture. Empty unless the `vector` profile is used.
  clip_models:
  # Pre-provisioned whisper weights, same posture. Empty unless the `voice` profile is used.
  stt_models:

networks:
  # No egress: nothing on this network can reach the internet, which is what makes
  # "user queries never leave" enforceable rather than aspirational.
  core:
    internal: true
  obs:
    internal: true
  # The only network with a route out. Everything on it fetches from publishers on a schedule and
  # never sees a user query — the crawler in M3, and the tool fetcher today.
  ingest:
