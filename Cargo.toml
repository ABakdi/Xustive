[workspace]
resolver = "2"
members = [
    "crates/xustive-text",
    "crates/xustive-tools",
    "crates/xustive-core",
    "crates/xustive-queue",
    "crates/xustive-toold",
    "crates/xustive-lang",
    "crates/xustive-knowledge",
    "crates/xustive-ingest",
    "crates/xustive-media",
    "crates/xustive-vector",
    "crates/xustive-ml",
    "crates/xustive-search",
    "crates/xustive-api",
    "crates/xustive-cli",
    "crates/xustive-federation",
    "crates/xustive-federator",
    "crates/xustive-loadgen",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/xustive/xustive"

[workspace.dependencies]
# --- serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# --- async runtime ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }

# --- http ---
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["timeout", "limit"] }
tower-http = { version = "0.6", features = [
    "trace", "cors", "limit", "timeout", "compression-gzip", "set-header", "fs", "catch-panic", "request-id", "util",
] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "socks"] }
http = "1"

# --- observability ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# --- errors ---
thiserror = "2"
anyhow = "1"

# --- ids, hashing, text ---
ulid = "1"
blake3 = "1"
unicode-normalization = "0.1"
url = "2"

# --- misc ---
clap = { version = "4", features = ["derive", "env"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
chacha20poly1305 = { version = "0.10", features = ["getrandom"] }
zeroize = "1"
base64 = "0.22"
