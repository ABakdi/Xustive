environment = "dev"

# Development configuration.
#
# Dev and prod differ only in replica counts and secrets. Any behavioural difference belongs in
# a config value here, never in an `if env == "prod"` branch in code.

[api]
bind_addr = "0.0.0.0:8080"
max_concurrent = 64
body_limit_default = 8192
timeout_search_ms = 1500
timeout_suggest_ms = 150
cors_origins = ["http://localhost:3000"]
static_dir = "web/public"

[search]
meili_url = "http://localhost:7700"
meili_key = ""
documents_index = "documents"
comments_index = "comments"
candidate_pool = 200
default_hits_per_page = 20
max_hits_per_page = 50
timeout_ms = 800

[telemetry]
log_filter = "info,xustive_api=debug,xustive_search=debug"
log_json = false

[discovery]
# Query-driven discovery: when a search comes up short, record the term and later resolve it to URLs
# by scraping search engines, then crawl those for next time. See docs/Decisions/ADR-0013.
weak_coverage_enabled = true
# A search returning at most this many results counts as a coverage gap worth chasing.
weak_coverage_result_floor = 3
# k-anonymity floor. 20 is the safe public default; this is a personal single-user engine, so 1 is
# fine — there is no one to anonymise against, and 20 would mean the feature never fires.
k_anonymity = 1
weak_coverage_window_days = 30
# Direct SERP scraping (ADR-0013), preferred over Brave. DuckDuckGo's lite endpoint answers a plain
# residential IP with real results, so it goes FIRST — Bing hands this client cloaked decoy results
# and Google an "enable JS" page, so putting either first would short-circuit the ladder on garbage.
serp_enabled = true
serp_engines = ["duckduckgo", "bing", "google"]
serp_max_queries_per_run = 50
# Proxy the SERP fetches route through. Empty = direct, which this datacentre IP gets bot-challenge
# pages on (so results stay empty). Point it at a rotating residential proxy to unblock: accepts
# http://, https://, or socks5:// with optional inline credentials, e.g.
#   serp_proxy = "http://USER:PASS@gate.provider.com:7000"
serp_proxy = ""

[federation]
# Query-time federation with a self-hosted SearXNG aggregator (M7, ADR-0017). **Off by default** —
# flip it on from the admin Integrations page once the `federation` compose profile is up
# (`docker compose --profile federation up -d`). The gateway client is built whenever `federator_url`
# is set, so the runtime toggle works without a restart, and with federation off there is zero
# overhead. Everything is fail-open: a gateway that is down just drops the "from the web" strip.
enabled = false
# The gateway's SearXNG endpoint. Used by the gateway container (which reaches SearXNG on the
# internal `ingest` network); shown on the console for reference. The API never calls this directly.
searxng_url = "http://xustive-searxng:8080"
# The Federation Gateway's address, which the host-run API calls — its one outbound target, an
# internal service, so the API keeps no route to the open internet. In dev it is published on
# localhost by docker-compose.dev.yml; in the full container topology it is http://xustive-federator:8095.
federator_url = "http://127.0.0.1:8095"
# Query-time latency budget. Federation runs concurrently with local retrieval and never makes the
# answer wait past this; miss it and results ship index-only.
budget_ms = 250
max_hits = 10
# Index each federated result immediately as a thin document (its title + snippet) so it shows as a
# real result within seconds; the full-page crawl then overwrites it (same URL-derived id). On for
# this personal dev engine, where immediacy is wanted; only fires when federation is switched on.
eager_index = true

[interaction]
# Anonymous interaction signals (M6): impressions/clicks as k-anonymous windowed counters that feed
# ranking (CTR) and re-crawl. Off by default — it amends ADR-0008's no-click-tracking promise, so it
# must be an explicit choice. No query log, no per-person record; see ADR-0015.
enabled = false
# k-anonymity floor. 20 is the ADR-0008 public floor; a value < 20 is refused outside `dev` (the
# guard). This is a single-user dev box, so 1 is honest ("one operator, no anonymity") — raise it to
# 20 before any multi-user deployment.
k_anonymity = 1
window_days = 90
# Clicks on a (query, doc) before the doc becomes a re-crawl freshness candidate. 0 = use k.
hot_click_floor = 0

[ml]
# The AI summary above results. A local Qwen model — nothing leaves this machine.
# summariser_model: empty = first present file in model_dir; or pin one from the registry. Qwen 7B
# gives noticeably better summaries (fewer withheld) but exceeds 4 GB VRAM — run it on CPU or a
# bigger card. To switch:
#   1. download:  huggingface-cli download Qwen/Qwen2.5-7B-Instruct-GGUF qwen2.5-7b-instruct-q4_k_m.gguf --local-dir models
#   2. select:    summariser_model = "qwen2.5-7b-instruct-q4"
summariser_model = ""
# Device: auto | gpu | cpu — also switchable live from the admin Compute page. GPU needs a binary
# built with `--features cuda` (CUDA toolkit at build time); without it this falls back to CPU.
device = "auto"
gpu_layers = -1
# Budget for one summary. The generator makes a second, varied attempt when the first is withheld for
# a fixable reason (uncited / wrong language) and time remains, so a larger budget buys the retry on
# slow CPU too; on GPU several attempts fit easily.
deadline_ms = 30000

[media]
# Index-side image OCR (M3-T07): fetch a crawled page's images and read the text inside them so it
# becomes searchable. Off by default — it adds a network fetch + CPU-bound OCR per image. Needs the
# tesseract traineddata provisioned in tessdata_dir (ara/fra/eng). Bounded per document.
image_ocr_enabled = false
tessdata_dir = "data/tessdata"
ocr_langs = "ara+fra+eng"
max_images_per_doc = 3
max_image_bytes = 5242880

# Engine for the user-facing OCR tools (the standalone tool and the "photograph → search" flow).
# "tesseract" runs in-process on the CPU and is always available; "unlimited" routes to the
# Unlimited-OCR sidecar (a 3B GPU vision-language model) and falls back to tesseract if it is down.
# The crawl-time enrichment above always uses tesseract regardless — it must fit CPU-only hardware.
ocr_backend = "tesseract"

[media.sidecar]
# The optional Unlimited-OCR service (services/ocr-sidecar). An internal-network HTTP call, not
# internet egress. Only reached when ocr_backend = "unlimited".
endpoint = "http://127.0.0.1:8091/ocr"
timeout_ms = 30000

[vector]
# Image-similarity search (reverse image search / the visual half of "search by image"). Off by
# default: needs Qdrant reachable and the CLIP embed sidecar (services/clip-embed) running. CLIP
# ViT-B/32 runs CPU-only, so this is not GPU-gated — only opt-in until its model + index exist.
enabled = false
qdrant_url = "http://127.0.0.1:6333"
qdrant_key = ""
collection = "image_clip"
embedder_endpoint = "http://127.0.0.1:8092/embed"
timeout_ms = 10000
search_limit = 40
ef_search = 64
# Per-mille (750 = cosine 0.75). Below this, "no similar images".
score_threshold_milli = 750
# TTL (days) for the phash → vector reuse cache: a re-posted image reuses its embedding instead of
# re-calling the model. 0 disables it.
embed_cache_ttl_days = 30

[stt]
# Voice search. Off by default: needs the STT sidecar (services/stt-sidecar) and its whisper model.
# Whisper small runs CPU-only, so voice is not GPU-gated — only opt-in until the model is provisioned.
enabled = false
endpoint = "http://127.0.0.1:8093/transcribe"
timeout_ms = 30000
max_audio_bytes = 8388608
