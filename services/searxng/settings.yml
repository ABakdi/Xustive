# Minimal SearXNG override for Xustive query-time federation (M7-T04, ADR-0017).
#
# SearXNG runs on the egress `ingest` network only — a user query reaches third-party engines
# through our own instance, never carrying a client IP, cookie, or identity. The serving plane
# cannot reach it directly; the Federation Gateway bridges to it.
#
# `use_default_settings: true` inherits the image's full engine list and only overrides what we need.
use_default_settings: true

server:
  # Dev-only secret. On any real deployment set SEARXNG_SECRET in deploy/.env and rotate this.
  secret_key: "xustive-dev-searxng-secret-change-me"
  # The only caller is our own gateway on an internal network, so the public rate-limiter is off.
  limiter: false
  image_proxy: false

search:
  # Federation reads JSON. The default image ships the JSON format disabled, so enable it explicitly
  # — without this, `format=json` returns 403 and federation gets nothing.
  formats:
    - html
    - json

# More engines than the image's four defaults (M13). All four — Brave, DuckDuckGo, Google CSE,
# Startpage — suspend a small instance within a day ("too many requests", CAPTCHA), which left
# the federation returning nothing at all on 2026-08-28. These do not, and several engines
# agreeing on a URL is what makes an endorsement (ADR-0031) worth more than one engine's say.
engines:
  - name: wikipedia
    disabled: false
  - name: bing
    disabled: false
  - name: qwant
    disabled: false
  - name: mojeek
    disabled: false
  - name: yahoo
    disabled: false
  - name: wikidata
    disabled: false

outgoing:
  # The image default (3 s) times Bing and Yahoo out from here; the gateway's own budget
  # still caps what a search waits for.
  request_timeout: 4.0
  max_request_timeout: 6.0
