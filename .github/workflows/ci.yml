name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Fast feedback: everything that needs no containers. Target is under 10 minutes total for
  # the whole workflow — slower than that and people learn to ignore it.
  check:
    name: fmt · clippy · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The summariser is optional and `make run-api-fast` exists to skip it, so the build without
      # it has to keep working. It broke once from a re-export that was not gated with its module,
      # and nothing noticed because every other build enables the feature.
      - name: build without the summariser
        run: cargo build -p xustive-api -p xustive-cli --no-default-features

      # The privacy guarantee, enforced rather than promised.
      - name: Telemetry lint (no query or credential fields in logs)
        run: ./scripts/lint-telemetry.sh

      # The production topology must not publish a database port.
      - name: Compose lint
        run: ./scripts/lint-compose.sh

      # Instructions must not reference commands that do not exist.
      - name: Docs lint
        run: ./scripts/lint-docs.sh

      # Every configured alert must have a runbook (M4-T09.5).
      - name: Runbook lint
        run: ./scripts/lint-runbooks.sh

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Advisories, and licences that must permit commercial use. Finding a copyleft transitive
      # dependency before launch is a nuisance; finding it after is a problem.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  egress:
    name: egress guarantee
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bring up the production topology
        run: docker compose -f deploy/docker-compose.yml up -d --no-start
      # Passes only if the connection FAILS. This is what makes "queries never leave" a
      # property of the network rather than a claim about the code.
      - name: Egress test
        run: ./scripts/test-egress.sh

  images:
    name: the deployment images still build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Every one of these broke silently at some point, and nothing noticed until a feature
      # went quiet in production: the tool fetcher's image failed for two weeks (it linked the
      # crawl pipeline's native OCR libraries), and the API's failed on a missing `rustfmt`, a
      # missing `make`, and a runtime image one Debian release behind the builder. A deployment
      # image that no longer builds is a deployment that silently keeps running old code.
      - name: Tool fetcher
        uses: docker/build-push-action@v6
        with: {context: ., file: deploy/Dockerfile.toold, push: false, cache-from: 'type=gha,scope=toold', cache-to: 'type=gha,mode=max,scope=toold'}
      - name: Federation gateway
        uses: docker/build-push-action@v6
        with: {context: ., file: deploy/Dockerfile.federator, push: false, cache-from: 'type=gha,scope=federator', cache-to: 'type=gha,mode=max,scope=federator'}
      - name: Crawl plane
        uses: docker/build-push-action@v6
        with: {context: ., file: deploy/Dockerfile.cli, push: false, cache-from: 'type=gha,scope=cli', cache-to: 'type=gha,mode=max,scope=cli'}
      - name: Web tier
        uses: docker/build-push-action@v6
        with: {context: ., file: deploy/Dockerfile.web, push: false, cache-from: 'type=gha,scope=web', cache-to: 'type=gha,mode=max,scope=web'}
      # Without the summariser: llama.cpp compiles for twenty minutes and would make every push
      # wait for it. This still catches the whole class of failure above — native libraries,
      # toolchain components, base-image drift — because those are the same either way.
      - name: Serving plane (no summariser)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          push: false
          build-args: FEATURES=
          cache-from: 'type=gha,scope=api'
          cache-to: 'type=gha,mode=max,scope=api'
      - name: The edge configuration parses
        run: |
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e XUSTIVE_DOMAIN=example.dz -e XUSTIVE_ACME_EMAIL=ci@example.dz \
            -e XUSTIVE_ADMIN_KEY=ci -e XUSTIVE_ADMIN_USER=ci \
            -e XUSTIVE_ADMIN_PASSWORD_HASH='$2a$14$abcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJKLMNOPQR' \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

  test:
    name: unit · integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --all-features

  # End-to-end against real infrastructure. Mocking Meilisearch would only test our idea of
  # Meilisearch, which is exactly the thing that turns out to be wrong.
  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    services:
      meilisearch:
        image: getmeili/meilisearch:v1.13
        env:
          MEILI_ENV: development
          MEILI_NO_ANALYTICS: "true"
        ports: ["7700:7700"]
        options: >-
          --health-cmd "curl -fsS http://localhost:7700/health || exit 1"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace

      - name: Generate corpus
        run: python3 scripts/gen_corpus.py --count 2000 --out tests/fixtures/corpus/documents.jsonl

      - name: Migrate
        run: cargo run -q -p xustive-cli -- --config config/ci.toml migrate

      - name: Settings drift check
        run: cargo run -q -p xustive-cli -- --config config/ci.toml migrate --check

      - name: Seed
        run: cargo run -q -p xustive-cli -- --config config/ci.toml seed

      - name: Start API
        run: |
          ./target/debug/xustive-api --config config/ci.toml > /tmp/xustive-api.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8080/readyz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:8080/readyz

      # Covers the exit gate: cross-language search, normalisation symmetry reaching the index,
      # the error contract, XSS escaping, the no-JS path, and the query-log canary.
      - name: Smoke suite
        run: ./scripts/smoke.sh

      - name: API log on failure
        if: failure()
        run: cat /tmp/xustive-api.log
